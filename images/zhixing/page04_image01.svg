      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1180" height="680" rx="28" fill="#f8fafc"/>
  <rect x="52" y="52" width="1076" height="576" rx="24" fill="url(#bg)" stroke="#dbe4f0" filter="url(#shadow)"/>
  <text x="92" y="112" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif" font-size="36" font-weight="800" fill="#1e40af">二八定律</text>
  <text x="92" y="150" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif" font-size="20" font-weight="500" fill="#64748b">20% 的关键少数影响 80% 的主要结果</text>
  
    <circle cx="390" cy="360" r="150" fill="#dbeafe" stroke="#1e40af" stroke-width="4"/>
    <path d="M390 360 L390 210 A150 150 0 0 1 532.7 313.6 Z" fill="#d97706" stroke="#ffffff" stroke-width="5"/>
    <text x="452" y="271" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="800" fill="#fff">20%</text>
<text x="452" y="301" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="800" fill="#fff">关键少数</text>
    <text x="330" y="409" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif" font-size="26" font-weight="800" fill="#1e40af">80%</text>
<text x="330" y="441" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif" font-size="26" font-weight="800" fill="#1e40af">多数因素</text>
    <path d="M570 360 L730 360" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <path d="M716 350 L730 360 L716 370" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="760" y="270" width="260" height="180" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="890" y="308" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="800" fill="#0f766e">抓住主要问题</text>
<text x="890" y="340" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="800" fill="#0f766e">解决主要矛盾</text>
<text x="890" y="372" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif" font-size="21" font-weight="800" fill="#0f766e">让少数投入产生多数结果</text>
  
